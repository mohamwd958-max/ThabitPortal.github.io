<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THABIT - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #030509;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* طبقة الـ Intro المظلمة بالكامل في البداية */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030509;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOutIntro 0.8s ease forwards;
            animation-delay: 2.2s;
        }

        /* كلمة THABIT وهي منورة لوحدها في الظلام */
        .intro-logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 
                         0 0 20px rgba(59, 130, 246, 0.4), 
                         0 0 40px rgba(59, 130, 246, 0.3);
            animation: pulseGlow 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 10px rgba(59, 130, 246, 0.4), 0 0 20px rgba(59, 130, 246, 0.2);
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 20px rgba(59, 130, 246, 0.9), 0 0 40px rgba(59, 130, 246, 0.7), 0 0 60px rgba(59, 130, 246, 0.5);
                transform: scale(1.05);
            }
        }

        @keyframes fadeOutIntro {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* خلفية الإزاز والكور المتحركة الناعمة */
        .glass-background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: rgba(3, 5, 9, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatOrbs 15s infinite alternate ease-in-out;
        }

        .orb-one {
            width: 400px;
            height: 400px;
            background: #1d4ed8;
            top: -10%;
            left: -10%;
            animation-duration: 18s;
        }

        .orb-two {
            width: 450px;
            height: 450px;
            background: #6d28d9;
            bottom: -15%;
            right: -10%;
            animation-duration: 22s;
        }

        .orb-three {
            width: 300px;
            height: 300px;
            background: #0891b2;
            top: 30%;
            left: 40%;
            animation-duration: 14s;
        }

        @keyframes floatOrbs {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 60px) scale(1.1); }
            100% { transform: translate(-60px, -80px) scale(0.95); }
        }

        /* الـ Header العلوي بعرض الصفحة بالكامل */
        .page-header {
            width: 100%;
            text-align: center;
            position: absolute;
            top: 60px;
            left: 0;
            z-index: 1;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .page-header .slogan {
            font-size: 15px;
            color: #94a3b8;
            font-style: italic;
            font-weight: 300;
        }

        /* الكارد في المنتصف (يحتوي Username, Password, Login فقط) */
        .login-card {
            background-color: #111621;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(59, 130, 246, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1;
            margin-top: 50px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #0a0e17;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #2563eb;
        }

        .forgot-password {
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 12px;
            color: #64748b;
            text-decoration: none;
            display: block;
            transition: 0.2s;
        }

        .forgot-password:hover {
            color: #94a3b8;
        }

        .error-message {
            margin-top: 12px;
            font-size: 12px;
            color: #ef4444;
        }

        /* حاوية الـ Connected */
        .connection-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            z-index: 1;
            background: rgba(17, 22, 33, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            height: 14px;
            width: 14px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: telegramPulse 2s infinite ease-in-out;
        }

        @keyframes telegramPulse {
            0% {
                box-shadow: 0 0 4px #22c55e, 0 0 8px #22c55e;
                opacity: 0.6;
            }
            50% {
                box-shadow: 0 0 16px #22c55e, 0 0 28px #22c55e;
                opacity: 1;
            }
            100% {
                box-shadow: 0 0 4px #22c55e, 0 0 8px #22c55e;
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>

    <!-- طبقة الظلام وكلمة ثابت المنورة في البداية -->
    <div id="intro-overlay">
        <div class="intro-logo">THABIT</div>
    </div>

    <div class="glass-background-layer">
        <div class="glow-orb orb-one"></div>
        <div class="glow-orb orb-two"></div>
        <div class="glow-orb orb-three"></div>
    </div>

    <!-- الـ Header العلوي بعرض الصفحة -->
    <header class="page-header">
        <h1>THABIT</h1>
        <div class="slogan">Welcome to the Future of Secure Access</div>
    </header>

    <!-- الكارد في المنتصف (Username, Password, Login فقط) -->
    <div class="login-card">
        <form method="POST">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="/forgot-password" class="forgot-password">Forgot password?</a>

        <div class="error-message">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
    </div>

    <div class="connection-status">
        <span class="status-dot"></span> Connected
    </div>

    <script>
        // مسح الـ Intro تماماً من الصفحة بعد انتهاء الأنيميشن
        setTimeout(function() {
            var overlay = document.getElementById('intro-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }, 3000);
    </script>

</body>
</html>
