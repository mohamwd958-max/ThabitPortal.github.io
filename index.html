    <style>
        :root {
            --bg: #030712; --text: #f1f5f9; --text-strong: #ffffff; --muted: #94a3b8; --soft: #cbd5e1;
            --card: rgba(18, 27, 48, 0.78); --card-border: rgba(255, 255, 255, 0.10);
            --input-bg: rgba(3, 7, 18, 0.85); --input-border: rgba(255, 255, 255, 0.12);
            --gold: #d4af37;
            --shadow: 0 30px 60px rgba(0, 0, 0, 0.6); --shadow-strong: 0 50px 100px -20px rgba(0, 0, 0, 0.9);
            --icon-color: rgba(255, 255, 255, 0.17);
        }

        body.light-theme {
            --bg: #f8fafc; --text: #1e293b; --text-strong: #0f172a; --muted: #475569; --soft: #334155;
            --card: rgba(255, 255, 255, 0.92); --card-border: rgba(15, 23, 42, 0.14);
            --input-bg: #f1f5f9; --input-border: rgba(15, 23, 42, 0.28);
            --gold: #a16207;
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.14); --shadow-strong: 0 30px 70px -15px rgba(15, 23, 42, 0.28);
            --icon-color: rgba(15, 23, 42, 0.15);
        }

        #thabitBg {
            position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
            color: var(--icon-color);
            -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0,0,0,0.4) 0%, #000 100%);
            mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0,0,0,0.4) 0%, #000 100%);
        }

        .mobile-floating-bar {
            position: fixed; left: 10px; bottom: 20px; z-index: 50;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px; border-radius: 9999px;
            display: flex; flex-direction: column; gap: 6px; align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        body.light-theme .mobile-floating-bar {
            background: rgba(255, 255, 255, 0.9); border: 1px solid #000000;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        }

        .circle-badge-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; background: #1e293b; color: #ffffff;
            border: none; border-radius: 50%; cursor: pointer; transition: transform 0.2s;
            font-family: 'Cairo', 'Inter', sans-serif;
        }

        body.light-theme .circle-badge-btn { background: #e2e8f0; color: #000000; }
        .circle-badge-btn:hover { transform: scale(1.12); }
        .circle-badge-btn.active { background: #2563eb !important; color: #ffffff !important; }
        .circle-badge-btn.theme-btn { color: #fbbf24; }
        .circle-badge-btn.admin-btn { color: #10b981; }
        body.light-theme .circle-badge-btn.admin-btn { color: #047857; }
        .circle-badge-btn i { font-size: 13px; }
        .bar-divider { width: 20px; height: 1px; background: #64748b; margin: 1px 0; }

        .assist-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #059669, #047857); color: #ffffff !important;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            text-decoration: none; font-family: 'Cairo', sans-serif; font-size: 7px; font-weight: 800; line-height: 1;
            transition: transform 0.2s; box-shadow: 0 4px 10px rgba(5, 150, 105, 0.45);
        }

        .assist-btn i { font-size: 14px; }
        .assist-btn:hover { transform: scale(1.12); }

        *, *:before, *:after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        *:focus { outline: none !important; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif !important;
            padding: 40px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #cinematicIntroOverlay {
            position: fixed;
            inset: 0;
            background-color: #020617;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
        }

        #cinematicIntroOverlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cinematic-intro-title {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 900 !important;
            font-size: 2rem;
            letter-spacing: 0.15em;
            padding-left: 0.2em;
            color: #d4af37;
            position: relative;
            opacity: 0;
            transform: scale(0.9);
            animation: introWordSequence 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes introWordSequence {
            0% { opacity: 0; transform: scale(0.85); filter: drop-shadow(0 0 0px rgba(212,175,55,0)); }
            25% { opacity: 1; transform: scale(1); color: #d4af37; filter: drop-shadow(0 0 10px rgba(212,175,55,0.4)); }
            50% { color: #fef08a; filter: drop-shadow(0 0 25px rgba(234, 179, 8, 0.9)) drop-shadow(0 0 45px rgba(212, 175, 55, 0.7)); transform: scale(1.05); }
            75% { color: #d4af37; filter: drop-shadow(0 0 10px rgba(212,175,55,0.5)); transform: scale(1); opacity: 1; }
            100% { opacity: 0; transform: scale(1.08); filter: drop-shadow(0 0 0px rgba(212,175,55,0)); }
        }

        .page-content-hidden { opacity: 0; visibility: hidden; }
        .page-content-visible { opacity: 1; visibility: visible; animation: fadeInContent 1s ease forwards; }

        @keyframes fadeInContent {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .screen.active { display: flex; }

        #login-screen {
            justify-content: center;
            align-items: center;
        }

        .portal-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1300px;
            position: relative;
            gap: 30px;
            z-index: 10;
            margin-bottom: 25px;
            direction: ltr;
        }

        .portal-card {
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            padding: 35px 30px;
            border-radius: 22px;
            width: 380px;
            min-height: 480px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden !important;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        [dir="rtl"] .portal-card { direction: rtl; }
        [dir="ltr"] .portal-card { direction: ltr; }

        .portal-card::before {
            content: '';
            position: absolute;
            top: -150%;
            left: -150%;
            width: 350%;
            height: 350%;
            background: linear-gradient(135deg, transparent 35%, rgba(212, 175, 55, 0.04) 42%, rgba(255, 215, 0, 0.16) 50%, rgba(212, 175, 55, 0.04) 58%, transparent 65%);
            pointer-events: none;
            z-index: 1;
            animation: cardGoldSwipe 7s linear infinite;
        }

        @keyframes cardGoldSwipe {
            0% { transform: translate(-30%, -30%); }
            100% { transform: translate(35%, 35%); }
        }

        .portal-card.side-card {
            transform: scale(0.9);
            opacity: 0.7;
            filter: blur(0.3px);
            pointer-events: auto;
            z-index: 2;
        }

        .portal-card.side-card:hover {
            opacity: 0.9;
            filter: blur(0px);
            transform: scale(0.93);
            box-shadow: var(--shadow);
        }

        .portal-card.active-card {
            transform: scale(1.04);
            opacity: 1;
            filter: blur(0px);
            z-index: 20;
            box-shadow: var(--shadow-strong);
            cursor: default;
            pointer-events: auto;
        }

        .portal-card > * {
            position: relative;
            z-index: 2;
        }

        .logo-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: center;
            margin-bottom: 25px;
            z-index: 10;
        }

        .glass-3d-logo-btn {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 32%, #475569 0%, #1e293b 45%, #090d16 75%, #020408 100%);
            box-shadow:
                inset 0 6px 12px rgba(255, 255, 255, 0.35),
                inset 0 -12px 25px rgba(0, 0, 0, 0.95),
                0 20px 40px rgba(0, 0, 0, 0.55),
                0 0 25px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.4s ease, box-shadow 0.4s ease;
            transform: scale(1) !important;
        }

        .glass-logo-text {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 900 !important;
            font-size: 2.2rem !important;
            color: #ffffff !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .card-header-title {
            font-size: 1.4rem;
            color: var(--text-strong);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif !important;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: var(--text-strong);
            font-weight: 700;
            font-family: 'Cairo', sans-serif !important;
        }

        .required-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #f43f5e;
            border-radius: 50%;
            margin-left: 3px;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.8);
            vertical-align: middle;
        }

        [dir="rtl"] .required-dot {
            margin-left: 0;
            margin-right: 3px;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border) !important;
            border-radius: 12px;
            color: var(--text-strong);
            font-size: 0.95rem;
            outline: none !important;
            box-shadow: none !important;
            font-family: 'Cairo', sans-serif !important;
            font-weight: 600;
        }

        .input-group input::placeholder {
            color: var(--muted);
            opacity: 0.8;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        [dir="rtl"] .password-wrapper input {
            padding-right: 16px;
            padding-left: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--soft);
            cursor: pointer;
            z-index: 5;
            font-size: 1.1rem;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 16px;
        }

        .btn {
            width: 100%;
            padding: 13px 16px;
            color: #ffffff !important;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            position: relative;
            font-family: 'Cairo', sans-serif !important;
            background: linear-gradient(135deg, #000000 0%, #111827 20%, #047857 40%, #ffffff 50%, #dc2626 60%, #111827 80%, #000000 100%) !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 6px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.85);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .assistant-join-btn {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif !important;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            text-decoration: none;
            margin-top: 20px;
        }

        .assistant-join-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .services-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .services-desc {
            color: var(--soft);
            text-align: center;
            font-size: 0.95rem;

                .querySelectorAll('[data-i18n-ph]')
                .forEach(el => {

                    const v = t[el.dataset.i18nPh];

                    if (v !== undefined)
                        el.placeholder = v;
                });

            document
                .querySelectorAll('[data-i18n-title]')
                .forEach(el => {

                    const v = t[el.dataset.i18nTitle];

                    if (v !== undefined)
                        el.title = v;
                });

            if (typeof onLanguageApplied === 'function')
                onLanguageApplied(lang, t);
        }


        function initThabitUI() {

            applyTheme(
                thabitLoad('thabit_theme') === 'light'
            );

            const saved = thabitLoad('thabit_lang');

            setLanguage(
                saved && PAGE_I18N[saved]
                    ? saved
                    : 'en'
            );
        }


        function runCinematicIntro() {

            const introOverlay =
                document.getElementById('cinematicIntroOverlay');

            const loginScreen =
                document.getElementById('login-screen');

            setTimeout(() => {

                introOverlay.classList.add('fade-out');

                setTimeout(() => {
                    introOverlay.style.display = 'none';
                }, 1000);

                loginScreen.classList.remove(
                    'page-content-hidden'
                );

                loginScreen.classList.add(
                    'page-content-visible'
                );

                loginScreen.classList.add('active');

            }, 3000);
        }


        function switchPortalCard(cardName) {

            if (window.innerWidth <= 900)
                return;

            const cardServ =
                document.getElementById('cardServices');

            const cardLogin =
                document.getElementById('cardLogin');

            const cardAbout =
                document.getElementById('cardAbout');

            cardServ.className =
                "portal-card side-card";

            cardLogin.className =
                "portal-card side-card";

            cardAbout.className =
                "portal-card side-card";


            if (cardName === 'login') {

                cardLogin.className =
                    "portal-card active-card";

                cardServ.className =
                    "portal-card side-card left";

            }

            else if (cardName === 'services') {

                cardServ.className =
                    "portal-card active-card";

            }

            else if (cardName === 'about') {

                cardAbout.className =
                    "portal-card active-card";

                cardLogin.className =
                    "portal-card side-card left";
            }
        }


        function togglePassVisibility() {

            const passwordInput =
                document.getElementById('password');

            const toggleIcon =
                document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {

                passwordInput.type = 'text';

                toggleIcon.classList.remove(
                    'fa-eye'
                );

                toggleIcon.classList.add(
                    'fa-eye-slash'
                );

            } else {

                passwordInput.type = 'password';

                toggleIcon.classList.remove(
                    'fa-eye-slash'
                );

                toggleIcon.classList.add(
                    'fa-eye'
                );
            }
        }


        async function handleLogin() {

            const t = PAGE_I18N[currentLang];

            const u =
                document.getElementById('username')
                .value
                .trim();

            const p =
                document.getElementById('password')
                .value
                .trim();

            const alertBox =
                document.getElementById('webAlertBox');

            const btn =
                document.getElementById('btnLoginBtn');


            if (!u || !p) {

                alertBox.innerText =
                    t.errEmpty;

                alertBox.className =
                    "show alert-error";

                setTimeout(() => {

                    alertBox.classList.remove(
                        'show'
                    );

                }, 3000);

                return;
            }


            btn.innerText =
                t.checking;

            btn.disabled = true;


            try {

                const response =
                    await fetch(
                        `${SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`
                    );

                const result =
                    await response.json();


                if (result.status === 'success') {

                    alertBox.innerText =
                        t.welcome.replace(
                            '{name}',
                            result.user.who
                        );

                    alertBox.className =
                        "show alert-success";


                    localStorage.setItem(
                        'currentTrainee',
                        JSON.stringify(result.user)
                    );


                    setTimeout(() => {

                        window.location.href =
                            'dashboard3.html';

                    }, 1000);


                } else {

                    alertBox.innerText =
                        result.message ||
                        t.errWrong;

                    alertBox.className =
                        "show alert-error";

                    btn.innerText =
                        t.getIn;

                    btn.disabled = false;

                    setTimeout(() => {

                        alertBox.classList.remove(
                            'show'
                        );

                    }, 4000);
                }


            } catch (err) {

                alertBox.innerText =
                    t.errConn;

                alertBox.className =
                    "show alert-error";

                btn.innerText =
                    t.getIn;

                btn.disabled = false;

                setTimeout(() => {

                    alertBox.classList.remove(
                        'show'
                    );

                }, 4000);
            }
        }


        window.onload = () => {

            initThabitUI();

            runCinematicIntro();

        };

    </script>

</body>
</html>
