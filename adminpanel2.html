    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:wght@900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', 'Cairo', sans-serif; 
            position: relative; 
            overflow-x: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease; 
            background-color: var(--bg);
        }

        .light-theme {
            background-color: #f8fafc !important;
            color: #000000 !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .mirror-glow-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .light-theme .mirror-glow-card {
            background: #ffffff !important;
            border: 1px solid #000000 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .static-title-dark { color: #ffffff !important; }
        .light-theme .static-title-dark { color: #000000 !important; }

        .repeat-btn-small {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; background: #059669; color: #ffffff !important; border: none !important; cursor: pointer; transition: transform 0.2s;
        }
        .repeat-btn-small:hover { transform: scale(1.1); }
        .repeat-btn-small.playing-active { background: #f59e0b !important; transform: scale(1.15); }

        .telegram-btn-green { background: #059669; color: #ffffff !important; }
        .telegram-btn-red { background: #e11d48; color: #ffffff !important; }

        .running-glow-border {
            border: 3px solid #10b981 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            border-radius: 1rem;
        }

        .custom-slider-track {
            position: relative; display: flex; align-items: center; gap: 2px; padding: 4px;
            background: rgba(2, 6, 23, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 9999px; cursor: pointer; user-select: none; width: 100%; max-width: 260px; height: 24px;
        }
        .light-theme .custom-slider-track { background: #f1f5f9; border: 1px solid #000000; }
        .custom-slider-segment { flex: 1; height: 10px; border-radius: 2px; background: #475569; }
        .light-theme .custom-slider-segment { background: #cbd5e1; }
        .custom-slider-thumb {
            position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 20px; background: #ffffff; border: 1.5px solid #000000; border-radius: 4px; cursor: grab; z-index: 10;
        }

        .sliders-drawer-wrapper, .admin-collapsible-section {
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; max-height: 500px; opacity: 1; overflow: hidden;
        }
        .sliders-drawer-wrapper.collapsed, .admin-collapsible-section.collapsed { max-height: 0px !important; opacity: 0; pointer-events: none; }

        .mobile-floating-bar {
            position: fixed; left: 10px; top: 50%; transform: translateY(-50%); max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: none; z-index: 50; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px; border-radius: 9999px; display: flex; flex-direction: column; gap: 6px; align-items: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .light-theme .mobile-floating-bar { background: rgba(255, 255, 255, 0.9); border: 1px solid #000000; }

        .circle-badge-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; background: #1e293b; color: #ffffff; border: none; border-radius: 50%; cursor: pointer; transition: transform 0.2s;
        }
        .light-theme .circle-badge-btn { background: #e2e8f0; color: #000000; }
        .circle-badge-btn:hover { transform: scale(1.12); }
        .circle-badge-btn.active { background: #2563eb !important; color: #ffffff !important; }

        :root {
            --bg: #030712; --text: #f1f5f9; --text-strong: #ffffff; --muted: #94a3b8; --soft: #cbd5e1;
            --card: rgba(18, 27, 48, 0.78); --card-border: rgba(255, 255, 255, 0.10);
            --icon-color: rgba(255, 255, 255, 0.17);
        }
        body.light-theme {
            --bg: #f8fafc; --text: #1e293b; --text-strong: #0f172a; --muted: #475569; --soft: #334155;
            --card: rgba(255, 255, 255, 0.92); --card-border: rgba(15, 23, 42, 0.14);
            --icon-color: rgba(15, 23, 42, 0.15);
        }

        #thabitBg {
            position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; color: var(--icon-color);
            -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0,0,0,0.4) 0%, #000 100%);
            mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0,0,0,0.4) 0%, #000 100%);
        }

        #wordInput.word-found { border: 3px solid #10b981 !important; box-shadow: 0 0 15px rgba(16,185,129,0.45); }
        #wordInput.word-missing { border: 3px solid #e11d48 !important; box-shadow: 0 0 15px rgba(225,29,72,0.4); }
        @keyframes reportPop {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(225,29,72,0.45); }
            50% { transform: scale(1.03); box-shadow: 0 0 0 4px rgba(225,29,72,0); }
        }
        #reportMissingBtn.pop-pulse { animation: reportPop 2.4s ease-in-out infinite; }

        .brand-logo { display: block; width: 46px; height: 46px; border-radius: 22%; box-shadow: 0 0 0 1px rgba(148,163,184,0.35); }
        .mean-btn { width: 100%; padding: 6px 4px; border-radius: 10px; font: 700 11px 'Cairo','Inter',sans-serif; line-height: 1.2; border: 1px solid rgba(148,163,184,0.4); background: rgba(2,6,23,0.6); color: #cbd5e1; cursor: pointer; transition: all .15s; }
        .mean-btn:hover { color: #ffffff; border-color: #60a5fa; }
        .mean-btn.on { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        body.light-theme .mean-btn { background: #ffffff; color: #334155; border-color: #0f172a; }
        body.light-theme .mean-btn:hover { color: #1d4ed8; }
        body.light-theme .mean-btn.on { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        #barTip { position: fixed; z-index: 200001; pointer-events: none; opacity: 0; transform: translateY(-50%) translateX(-4px); transition: opacity .18s ease, transform .18s ease; padding: 6px 12px; border-radius: 10px; background: #0f172a; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.18); font: 700 .75rem 'Cairo','Inter',sans-serif; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
        #barTip.show { opacity: 1; transform: translateY(-50%) translateX(0); }
        body.light-theme #barTip { background: #ffffff; color: #0f172a; border-color: #0f172a; }
        @media (max-width: 640px) {
            body#bodyRoot > main, body#bodyRoot > footer { padding-left: 64px !important; }
        }
    </style>
</head>

<style id="assistantExtraCss">

.admin-big { display:flex; align-items:center; gap:12px; width:100%; padding:16px 18px; border-radius:16px; border:1px solid rgba(148,163,184,.35); background:rgba(30,41,59,.6); color:inherit; font:800 .95rem 'Cairo',sans-serif; cursor:pointer; text-align:start; transition:transform .15s, border-color .15s; }

.admin-big i { font-size:1.2rem; color:#fbbf24; width:26px; text-align:center; }

#generalToast { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:200000; display:none; align-items:center; gap:10px; max-width:min(90vw,420px); width:max-content; padding:14px 20px; border-radius:16px; font:700 .9rem 'Cairo','Inter',sans-serif; text-align:center; color:#fff; box-shadow:0 20px 60px rgba(0,0,0,.55); pointer-events:none; }

.report-card { white-space:pre-wrap; word-break:break-word; }
</style>
<style id="thaSharedCss">
.circle-badge-btn.admin-btn{color:#10b981}

body.light-theme .text-amber-300,body.light-theme .text-amber-400{color:#b45309!important}

.tha-modal{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(2,6,23,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.tha-x{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:rgba(148,163,184,.25);color:inherit;font-size:14px}

<script>
let isAdminAuthenticated = false;
        const SUPABASE_URL = "https://vkfexceitwjmxncwceqb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZmV4Y2VpdHdqbXhuY3djZXFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzY5MTEsImV4cCI6MjEwNTkxMjkxMX0.6ArXtykrZhdNInphpg_LQTIvULkpwnnlzHA3dKhrNoI";
        const BUCKET_NAME = "audio-files";

        let globalDueWordsCache = [];
        // ================= Clean Text Function (Ignores Punctuation) =================
        function cleanWordString(str) {
            if (!str) return "";
            // Removes punctuation like . , ! ? " ' ; : etc.
            return str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim().toLowerCase();
        }

function closeAdminAuthModal() {}
        async function loadDueWordsListFromSupabase() {
            const container = document.getElementById('dueWordsContainer');
            const countBadge = document.getElementById('dueWordsCount');
            
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/due_words_table?status=eq.pending&order=created_at.asc`, {
                    headers: await ThabitAdmin.hdr()
                });
                const data = await res.json();
                globalDueWordsCache = data || [];
                countBadge.textContent = globalDueWordsCache.length;

                if (!globalDueWordsCache || globalDueWordsCache.length === 0) {
                    container.innerHTML = `<span class="text-xs text-slate-500 text-center py-2">لا توجد كلمات معلقة الآن.</span>`;
                    return;
                }

                container.innerHTML = "";
                globalDueWordsCache.forEach((item, index) => {
                    const timeStr = new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = new Date(item.created_at).toLocaleDateString();

                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between bg-slate-950/70 light-theme:bg-slate-200 px-3 py-2 rounded-lg border border-slate-700 light-theme:border-black text-xs";
                    row.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <span class="font-mono text-amber-400 font-bold">#${index + 1}</span>
                            <div class="flex flex-col">
                                <span class="font-bold text-white light-theme:text-black">${escapeHtml(item.word)}</span>
                                <span class="text-[9px] text-indigo-300">بواسطة: ${escapeHtml(item.trainee_name || 'غير معروف')}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] text-slate-400">${dateStr} - ${timeStr}</span>
                            <button type="button" onclick="moveDueToTrashInSupabase('${escapeHtml(item.id)}')" title="نقل للسلة" class="hover:text-rose-400 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            } catch (e) {
                container.innerHTML = `<span class="text-xs text-rose-400 text-center py-2">فشل جلب الكلمات من السيرفر</span>`;
            }
        }

        async function moveDueToTrashInSupabase(id) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/due_words_table?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: await ThabitAdmin.hdr({'Content-Type': 'application/json'}),
                    body: JSON.stringify({ status: 'trashed' })
                });
                loadDueWordsListFromSupabase();
                loadTrashBinListFromSupabase();
                showAdminToast("تم نقل الكلمة للـ Trash بنجاح", "success");
            } catch(e){}
        }

        async function loadTrashBinListFromSupabase() {
            const container = document.getElementById('trashWordsContainer');
            const countBadge = document.getElementById('trashCount');
            
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/due_words_table?status=eq.trashed&order=created_at.desc`, {
                    headers: await ThabitAdmin.hdr()
                });
                const data = await res.json();
                countBadge.textContent = data ? data.length : 0;

                if (!data || data.length === 0) {
                    container.innerHTML = `<span class="text-xs text-slate-500 text-center py-2">سلة المهملات فارغة.</span>`;
                    return;
                }

                container.innerHTML = "";
                data.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between bg-slate-950/70 light-theme:bg-slate-200 px-3 py-2 rounded-lg border border-slate-700 light-theme:border-black text-xs";
                    row.innerHTML = `
                        <span class="font-medium">${escapeHtml(item.word)} (${escapeHtml(item.trainee_name)})</span>
                        <span class="text-[10px] text-slate-500">${new Date(item.created_at).toLocaleDateString()}</span>
                    `;
                    container.appendChild(row);
                });
            } catch (e) {}
        }

        function handleAdminSpacebar(event) {
            if (event.key === ' ' || event.code === 'Space') {
                const inputField = document.getElementById('newWordInput');
                if (inputField.value.trim() === '') {
                    event.preventDefault(); 
                    if (globalDueWordsCache && globalDueWordsCache.length > 0) {
                        const nextWordObj = globalDueWordsCache[0];
                        inputField.value = nextWordObj.word;
                        showAdminToast(`تم سحب الكلمة التي عليها الدور: "${nextWordObj.word}" (من: ${nextWordObj.trainee_name})`, "success");
                        checkIfWordExistsInDb(nextWordObj.word);
                    } else {
                        showAdminToast("لا توجد كلمات معلقة في الدور حالياً!", "error");
                    }
                }
            }
        }

        async function uploadAndSaveToSupabase() {
            const word = document.getElementById('newWordInput').value.trim();
            if (!word || !adminRecordedBlob) {
                showAdminToast("اكتب كلمة وسجل صوتها أولاً!", "error");
                return;
            }
            const saveBtn = document.getElementById('saveToSupabaseBtn');
            saveBtn.setAttribute('disabled', 'true');
            showAdminToast("جاري الرفع للـ Database...", "success");
            try {
                const fileName = `${word.replace(/\s+/g, '_')}_${Date.now()}.mp3`;
                const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${fileName}`, {
                    method: 'POST',
                    headers: await ThabitAdmin.hdr({'Content-Type': 'audio/mp3'}),
                    body: adminRecordedBlob
                });
                if (!uploadRes.ok) throw new Error();
                const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${fileName}`;

                await fetch(`${SUPABASE_URL}/rest/v1/words_table`, {
                    method: 'POST',
                    headers: await ThabitAdmin.hdr({'Content-Type': 'application/json'}),
                    body: JSON.stringify({ word: word, audio_url: publicUrl })
                });

                if (globalDueWordsCache.length > 0) {
                    const matchItem = globalDueWordsCache.find(i => cleanWordString(i.word) === cleanWordString(word));
                    if (matchItem) {
                        await moveDueToTrashInSupabase(matchItem.id);
                    }
                }

                showAdminToast("تم حفظ الكلمة وصوتها بنجاح وتنظيفها من القائمة! 🚀", "success");

                document.getElementById('newWordInput').value = "";
                document.getElementById('adminAudioPlayback').classList.add('hidden');
                adminRecordedBlob = null;
                loadDueWordsListFromSupabase();
                loadTrashBinListFromSupabase();
            } catch (err) {
                showAdminToast("حدث خطأ أثناء الرفع", "error");
            } finally {
                saveBtn.removeAttribute('disabled');
            }
        }

        let adminMediaRecorder = null;
        let adminAudioChunks = [];
        let adminRecordedBlob = null;
        let adminIsRecording = false;
        let adminTimerInterval = null;
        let adminSeconds = 0;

        async function checkIfWordExistsInDb(wordVal) {
            const cleanWord = cleanWordString(wordVal);
            const conflictBox = document.getElementById('dbWordConflictBox');
            if (!cleanWord) {
                conflictBox.classList.add('hidden');
                return;
            }
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/words_table`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const dbData = await res.json();
                const found = dbData && dbData.some(r => cleanWordString(r.word) === cleanWord);
                if (found) conflictBox.classList.remove('hidden');
                else conflictBox.classList.add('hidden');
            } catch (e) {}
        }

        function pronounceAdminGoogleTranslation() {
            const val = document.getElementById('newWordInput').value.trim();
            if (!val) return;
            const utterance = new SpeechSynthesisUtterance(val);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        async function toggleAdminRecording() {
            const btn = document.getElementById('adminRecordBtn');
            const icon = document.getElementById('adminRecordIcon');
            const timer = document.getElementById('adminTimer');
            const playback = document.getElementById('adminAudioPlayback');

            if (!adminIsRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    adminMediaRecorder = new MediaRecorder(stream);
                    adminAudioChunks = [];
                    adminMediaRecorder.ondataavailable = e => { if (e.data.size > 0) adminAudioChunks.push(e.data); };
                    adminMediaRecorder.onstop = () => {
                        adminRecordedBlob = new Blob(adminAudioChunks, { type: 'audio/mp3' });
                        playback.src = URL.createObjectURL(adminRecordedBlob);
                        playback.classList.remove('hidden');
                        document.getElementById('saveToSupabaseBtn').removeAttribute('disabled');
                    };
                    adminMediaRecorder.start();
                    adminIsRecording = true;
                    btn.classList.replace('telegram-btn-red', 'bg-amber-600');
                    icon.className = "fa-solid fa-stop";
                    adminSeconds = 0;
                    adminTimerInterval = setInterval(() => {
                        adminSeconds++;
                        timer.textContent = `00:${adminSeconds < 10 ? '0' : ''}${adminSeconds}`;
                    }, 1000);
                } catch (err) {}
            } else {
                adminMediaRecorder.stop();
                adminIsRecording = false;
                clearInterval(adminTimerInterval);
                btn.classList.replace('bg-amber-600', 'telegram-btn-red');
                icon.className = "fa-solid fa-microphone";
            }
        }
</script>

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ===== central toast ===== */
let toastTimer = null;
function showGeneralToast(msg, type) {
  const el = document.getElementById('generalToast');
  const ic = document.getElementById('generalToastIcon');
  const kind = type === 'red' ? 'red' : (type === 'orange' || type === 'error') ? 'orange' : 'success';
  el.className = 'show t-' + kind;
  ic.className = 'fa-solid ' + (kind === 'success' ? 'fa-circle-check' : kind === 'red' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation');
  document.getElementById('generalToastMsg').textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = ''; }, 3800);
}
function showAdminToast(msg, type) { showGeneralToast(msg, type === 'success' ? 'success' : 'red'); }
/* ===== admin panel ===== */
function toggleAdminPanel() {
  const o = document.getElementById('adminModalOverlay');
  const opening = !o.classList.contains('open');
  o.classList.toggle('open', opening);
  document.body.style.overflow = opening ? 'hidden' : '';
  if (!opening) { window.location.href = 'index.html'; return; }
  if (opening) { showAdminView('home'); refreshReportsBadge(); }
}
function showAdminView(v) {
  document.getElementById('adminHome').style.display = v === 'home' ? 'flex' : 'none';
  document.getElementById('adminViewVoices').style.display = v === 'voices' ? '' : 'none';
  document.getElementById('adminViewReports').style.display = v === 'reports' ? '' : 'none';
  if (v === 'voices') {
    loadDueWordsListFromSupabase();
    loadTrashBinListFromSupabase();
    setTimeout(function () { const f = document.getElementById('newWordInput'); if (f) f.focus(); }, 100);
  } else if (v === 'reports') {
    loadReportsList();
  } else if (v === 'mods') {
    ThabitAdmin.open();
  }
}
function toggleAdminSection(sectionId, iconId) {
  const sec = document.getElementById(sectionId);
  if (!sec) return;
  const collapsed = sec.classList.toggle('collapsed');
  const ic = document.getElementById(iconId);
  if (ic) ic.style.transform = collapsed ? '' : 'rotate(180deg)';
}
let conflictAction = 'replace';
function setConflictAction(a) {
  conflictAction = a;

  const off = 'flex-1 py-1.5 px-3 rounded-lg bg-slate-800 light-theme:bg-slate-200 text-xs font-semibold transition';

}
async function refreshReportsBadge() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/reports?select=id&limit=1000', { headers: await ThabitAdmin.hdr() });
    if (!res.ok) return;
    const rows = await res.json();
    document.getElementById('reportsBadge').textContent = Array.isArray(rows) ? rows.length : 0;
  } catch (e) {}
}
async function loadReportsList() {
  const box = document.getElementById('reportsContainer');
  box.textContent = '...';
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/reports?select=*&order=created_at.desc&limit=200', { headers: await ThabitAdmin.hdr() });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    document.getElementById('reportsBadge').textContent = rows.length;
    box.innerHTML = '';
    if (!rows.length) { box.textContent = uiLang === 'en' ? 'No reports yet.' : 'لا توجد بلاغات حتى الآن.'; return; }
    rows.forEach(function (r) {
      const card = document.createElement('div');
      card.className = 'tha-row';
      const head = document.createElement('div');
      head.className = 'tha-lab';
      const who = document.createElement('span');
      who.textContent = '👤 ' + (r.name || '—');
      const when = document.createElement('span');
      when.className = 'tha-tag';
      when.textContent = r.created_at ? new Date(r.created_at).toLocaleString() : '';
      head.appendChild(who); head.appendChild(when);
      const body = document.createElement('div');
      body.className = 'report-card';
      body.style.fontSize = '.85rem';
      body.style.lineHeight = '1.7';
      body.textContent = r.problem || '';
      const bt = document.createElement('div');
      bt.className = 'tha-btns';
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'tha-b red';
      del.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
      del.onclick = function () { deleteReport(r.id); };
      bt.appendChild(del);
      card.appendChild(head); card.appendChild(body); card.appendChild(bt);
      box.appendChild(card);
    });
  } catch (e) {
    box.textContent = 'تعذر تحميل البلاغات — شغّل ملف supabase_setup.sql في Supabase وتأكد إنك مسجّل دخول.';
  }
}
async function deleteReport(id) {
  if (!confirm('حذف هذا البلاغ نهائيًا؟')) return;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/reports?id=eq.' + encodeURIComponent(id), { method: 'DELETE', headers: await ThabitAdmin.hdr() });
    if (!res.ok) throw new Error();
    loadReportsList();
  } catch (e) { showAdminToast('تعذر حذف البلاغ', 'error'); }
}

    en:"Be on time: if you are more than 20 minutes late after the agreed time, your payment is non-refundable.\nIf you are late by less than 20 minutes, a late fee of {fee} EGP per minute applies.\nBring a pen and paper to take notes — this is very important.\nMake sure your internet connection is stable.\nUse good headphones — or at least make sure the audio is crystal clear: no crackling, no background noise, no side conversations.",
    ar:"الالتزام بالموعد: إذا تأخرت أكثر من 20 دقيقة عن الموعد المتفق عليه فلن يتم استرداد المبلغ المدفوع.\nإذا كان التأخير أقل من 20 دقيقة تُحتسب غرامة {fee} جنيهًا عن كل دقيقة تأخير.\nأحضر ورقة وقلمًا لتدوين الملاحظات، وهذا مهم جدًا.\nتأكد من ثبات اتصال الإنترنت.\nاستخدم سماعة جيدة، أو على الأقل تأكد من وضوح الصوت تمامًا: بدون تقطيع أو ضوضاء أو أحاديث جانبية.",
    eg:"الالتزام بالميعاد: لو اتأخرت أكتر من 20 دقيقة عن الميعاد المتفق عليه فلوسك مش هتترجع.\nلو التأخير أقل من 20 دقيقة بتتحسب غرامة {fee} جنيه على كل دقيقة.\nهات ورقة وقلم تدوّن عليهم ملاحظات، ودي مهمة جدًا.\nتأكد إن النت ثابت.\nاستخدم سماعة كويسة، أو على الأقل الصوت يكون واضح: من غير خرفشة ولا دوشة ولا كلام جانبي."
  },"One rule per line");
  R("pl.termsTitle","Terms heading","text","Placement",{en:"Thabit's strict terms are as follows:",ar:"بنود ثابت الصارمة كالتالي:",eg:"بنود ثابت الصارمة هي كالتالي:"});
  R("pl.terms","Terms & policies","list","Placement",{
    en:"Term number one — edit me from the admin panel\nTerm number two — edit me from the admin panel\nTerm number three — edit me from the admin panel",
    ar:"البند الأول — عدّلني من لوحة الأدمن\nالبند الثاني — عدّلني من لوحة الأدمن\nالبند الثالث — عدّلني من لوحة الأدمن",
    eg:"البند الأول — عدّلني من لوحة الأدمن\nالبند الثاني — عدّلني من لوحة الأدمن\nالبند الثالث — عدّلني من لوحة الأدمن"
  },"One term per line (numbered automatically)");
  R("pl.wa","WhatsApp number (digits, with country code)","text","Placement","201000000000");
  R("pl.tg","Telegram username (without @)","text","Placement","thabit");

  /* ---------- admin UI ---------- */
  var curPage="";
  var p=location.pathname.toLowerCase();
  if(p.indexOf("placement")>-1)curPage="Placement";else if(p.indexOf("assistant")>-1)curPage="Assistant";else if(p.indexOf("dashboard")>-1)curPage="Dashboard";else if(p.indexOf("admin")>-1)curPage="";else curPage="Portal";
  function msg(t,bad){var m=$("thaMsg");m.textContent=t;try{if(window.showGeneralToast)window.showGeneralToast(t,bad?"red":"success")}catch(e){}m.style.color=bad?"#f43f5e":"#10b981";clearTimeout(msg._t);msg._t=setTimeout(function(){m.textContent=""},4500)}
  function renderPages(){
    var pages=["All"];order.forEach(function(k){if(pages.indexOf(defs[k].page)<0)pages.push(defs[k].page)});
    var box=$("thaPages");box.innerHTML="";
    pages.forEach(function(pg){var b=document.createElement("button");b.type="button";b.className="tha-tab"+((curPage===pg||(!curPage&&pg==="All"))?" on":"");b.textContent=pg;b.onclick=function(){curPage=pg==="All"?"":pg;renderPages();renderList()};box.appendChild(b)});
  }
  function renderList(){
    var q=($("thaSearch").value||"").toLowerCase(),box=$("thaList");box.innerHTML="";
    order.forEach(function(k){
      var d=defs[k];if(curPage&&d.page!==curPage)return;
      if(q&&(k+" "+d.label).toLowerCase().indexOf(q)<0)return;
      var row=document.createElement("div");row.className="tha-row";
      var lab=document.createElement("div");lab.className="tha-lab";
      var s1=document.createElement("span");s1.textContent=d.label;var s2=document.createElement("span");s2.className="tha-tag";s2.textContent=d.page;
      lab.appendChild(s1);lab.appendChild(s2);row.appendChild(lab);
      var val=hasOv(k)?over[k]:defOf(k);
      var inp=document.createElement(d.type==="text"||d.type==="image"?"input":"textarea");inp.className="tha-in";inp.value=val;
      if(d.type==="image")inp.placeholder="https://... image URL";
      row.appendChild(inp);
      if(d.hint){var h=document.createElement("div");h.className="tha-note";h.textContent=d.hint;row.appendChild(h)}
      var img=null;
      if(d.type==="image"){img=document.createElement("img");img.className="tha-img";if(val)img.src=val;else img.style.display="none";row.appendChild(img);inp.oninput=function(){if(inp.value){img.src=inp.value;img.style.display=""}else img.style.display="none"}}
      var bt=document.createElement("div");bt.className="tha-btns";
      if(d.type==="image"){
        var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.style.display="none";
        var ub=document.createElement("button");ub.type="button";ub.className="tha-b blue";ub.innerHTML='<i class="fa-solid fa-upload"></i> Upload image';
        ub.onclick=function(){fi.click()};
        fi.onchange=function(){if(!fi.files[0])return;ub.disabled=true;upload(fi.files[0],"site",null,true).then(function(u){inp.value=u;img.src=u;img.style.display="";msg("Uploaded ✓ — press Save")}).catch(function(){msg("Upload failed (create the placement-files bucket)",1)}).then(function(){ub.disabled=false})};
        bt.appendChild(ub);bt.appendChild(fi);
      }
      var sb=document.createElement("button");sb.type="button";sb.className="tha-b";sb.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Save';
      sb.onclick=function(){sb.disabled=true;save(k,inp.value).then(function(ok){msg(ok?"Saved ✓":(save.err==="auth"?"Session expired — sign out and sign in again":"Not saved to the server — "+(save.err||"")+" (run supabase_setup.sql)"),!ok)}).then(function(){sb.disabled=false})};
      var rb=document.createElement("button");rb.type="button";rb.className="tha-b gray";rb.innerHTML='<i class="fa-solid fa-rotate-left"></i> Reset';
      rb.onclick=function(){reset(k).then(function(){inp.value=defOf(k);if(img){if(inp.value){img.src=inp.value}else img.style.display="none"}msg("Back to default ✓")})};
      bt.appendChild(sb);bt.appendChild(rb);row.appendChild(bt);box.appendChild(row);
    });
    if(!box.children.length){box.innerHTML='<p class="tha-note" style="margin-top:12px">Nothing here.</p>'}
  }
  var pending=null;
  function showPanel(){$("thaPanel").classList.add("open");renderPages();renderList()}
  function open(cb){
    pending=typeof cb==="function"?cb:showPanel;
    ensure().then(function(t){if(t){var f=pending;pending=null;f()}else{$("thaAuthErr").textContent="";$("thaAuth").classList.add("open");setTimeout(function(){$("thaEmail").focus()},50)}});
  }
  function auth(){
    var b=$("thaAuthOk");b.disabled=true;
    login($("thaEmail").value.trim(),$("thaPass").value).then(function(){$("thaPass").value="";$("thaAuth").classList.remove("open");var f=pending||showPanel;pending=null;f()}).catch(function(){$("thaAuthErr").textContent="الإيميل أو الباسورد غلط · Wrong email or password"}).then(function(){b.disabled=false});
  }
  $("thaAuthOk").onclick=auth;$("thaPass").onkeydown=function(e){if(e.key==="Enter")auth()};
  $("thaAuthCancel").onclick=function(){pending=null;$("thaAuth").classList.remove("open")};
  $("thaOut").onclick=function(){setSess(null);$("thaPanel").classList.remove("open");msg("")};
  $("thaClose").onclick=function(){$("thaPanel").classList.remove("open")};
  $("thaSearch").oninput=renderList;
  function tab(n){["C","A","B"].forEach(function(x){$("thaPane"+x).style.display=x===n?"":"none";$("thaTab"+x).classList.toggle("on",x===n)});if(n==="B")loadBookings()}
  $("thaTabC").onclick=function(){tab("C")};$("thaTabA").onclick=function(){tab("A")};$("thaTabB").onclick=function(){tab("B")};
  function loadBookings(){
    var box=$("thaBook");box.textContent="...";
    adminFetch(SB+"/rest/v1/placement_bookings?select=*&order=created_at.desc&limit=50").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
      box.innerHTML="";if(!rows.length){box.textContent="No bookings yet.";return}
      rows.forEach(function(b){
        var d=document.createElement("div");d.className="tha-row";
        var l=document.createElement("div");l.className="tha-lab";var a=document.createElement("span");a.textContent=b.name+" · "+b.date+" "+b.time;var g=document.createElement("span");g.className="tha-tag";g.textContent=b.pay_method;l.appendChild(a);l.appendChild(g);d.appendChild(l);
        [["English",b.english],["Psych",b.psych],["Secret",b.secret],["Proof",b.proof]].forEach(function(x){if(!x[1])return;var an=document.createElement("a");an.href=x[1];an.target="_blank";an.rel="noopener";an.textContent=x[0]+" ↗";an.style.cssText="color:#60a5fa;font-weight:800;font-size:.8rem";d.appendChild(an)});
        box.appendChild(d);
      });
    }).catch(function(){box.textContent="Could not load bookings (sign in again / check the table policies)."});
  }

  /* audio tab */
  var rec=null,chunks=[],blob=null,on=false,tmr=null,sec=0;
  $("thaRec").onclick=function(){
    var btn=$("thaRec");
    if(!on){
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
        rec=new MediaRecorder(st);chunks=[];
        rec.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data)};
        rec.onstop=function(){st.getTracks().forEach(function(t){t.stop()});blob=new Blob(chunks,{type:"audio/mp3"});var a=$("thaPlay");a.src=URL.createObjectURL(blob);a.style.display="";$("thaUp").disabled=false};
        rec.start();on=true;btn.innerHTML='<i class="fa-solid fa-stop"></i> Stop';sec=0;
        tmr=setInterval(function(){sec++;$("thaTimer").textContent="00:"+(sec<10?"0":"")+sec},1000);
      }).catch(function(){msg("Microphone not allowed",1)});
    }else{rec.stop();on=false;clearInterval(tmr);btn.innerHTML='<i class="fa-solid fa-microphone"></i> Record'}
  };
  $("thaUp").onclick=function(){
    var w=$("thaWord").value.trim();if(!w||!blob){msg("Type a word and record first",1);return}
    var b=this;b.disabled=true;var fn=w.replace(/\s+/g,"_")+"_"+Date.now()+".mp3";
    adminFetch(SB+"/storage/v1/object/audio-files/"+fn,{method:"POST",headers:{"Content-Type":"audio/mp3"},body:blob}).then(function(r){if(!r.ok)throw 0;
      return adminFetch(SB+"/rest/v1/words_table",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({word:w,audio_url:SB+"/storage/v1/object/public/audio-files/"+fn})})}).then(function(r){if(!r.ok)throw 0;msg("Saved ✓");$("thaWord").value="";$("thaPlay").style.display="none";blob=null}).catch(function(){msg("Upload failed",1);b.disabled=false});
  };
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){$("thaPanel").classList.remove("open");$("thaAuth").classList.remove("open")}});

  /* mount admin button in the floating bar */
  function mount(){
    var bar=$("mobileFloatingBar");if(!bar||$("floatBtnAdmin"))return;
    var d=document.createElement("div");d.className="bar-divider";
    var b=document.createElement("button");b.type="button";b.id="floatBtnAdmin";b.title="Fedawy Admin Panel";b.className="circle-badge-btn admin-btn";b.innerHTML='<i class="fa-solid fa-plus"></i>';b.onclick=open;
    bar.appendChild(d);bar.appendChild(b);
  }
  mount();
  var o=window.setLanguage;
  if(typeof o==="function"&&!o._tha){var w=function(){var r=o.apply(this,arguments);apply();return r};w._tha=1;window.setLanguage=w}

  window.ThabitCMS={get:get,apply:apply,load:load,save:save,upload:upload,post:post,onApply:function(f){hooks.push(f)},sub:sub};
  window.ThabitAdmin={open:open,hdr:hdr};
  apply();load();
})();
</script>
<script>
/* ===== admin page bootstrap ===== */
(function(){
  var go=function(){window.location.href='index.html'};
  document.getElementById('thaAuthCancel').addEventListener('click',go);
  document.getElementById('thaOut').addEventListener('click',go);
  window.addEventListener('DOMContentLoaded',function(){
    ThabitAdmin.open(function(){ toggleAdminPanel(); });
  });
})();
</script>
</body>
