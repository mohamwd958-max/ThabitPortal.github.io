    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:wght@900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', 'Cairo', sans-serif; 
            position: relative; 
            overflow-x: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease; 
            background-color: var(--bg);
        }

        .light-theme {
            background-color: #f8fafc !important;
            color: #000000 !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .mirror-glow-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .light-theme .mirror-glow-card {
            background: #ffffff !important;
            border: 1px solid #000000 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .static-title-dark { color: #ffffff !important; }
        .light-theme .static-title-dark { color: #000000 !important; }

        .repeat-btn-small {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; background: #059669; color: #ffffff !important; border: none !important; cursor: pointer; transition: transform 0.2s;
        }
        .repeat-btn-small:hover { transform: scale(1.1); }
        .repeat-btn-small.playing-active { background: #f59e0b !important; transform: scale(1.15); }

        .telegram-btn-green { background: #059669; color: #ffffff !important; }
        .telegram-btn-red { background: #e11d48; color: #ffffff !important; }

        .running-glow-border {
            border: 3px solid #10b981 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            border-radius: 1rem;
        }

        .custom-slider-track {
            position: relative; display: flex; align-items: center; gap: 2px; padding: 4px;
            background: rgba(2, 6, 23, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 9999px; cursor: pointer; user-select: none; width: 100%; max-width: 260px; height: 24px;
        }
        .light-theme .custom-slider-track { background: #f1f5f9; border: 1px solid #000000; }
        .custom-slider-segment { flex: 1; height: 10px; border-radius: 2px; background: #475569; }
        .light-theme .custom-slider-segment { background: #cbd5e1; }
        .custom-slider-thumb {
            position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 20px; background: #ffffff; border: 1.5px solid #000000; border-radius: 4px; cursor: grab; z-index: 10;
        }

        .sliders-drawer-wrapper, .admin-collapsible-section {
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; max-height: 500px; opacity: 1; overflow: hidden;
        }
        .sliders-drawer-wrapper.collapsed, .admin-collapsible-section.collapsed { max-height: 0px !important; opacity: 0; pointer-events: none; }

        .mobile-floating-bar {
            position: fixed; left: 10px; top: 50%; transform: translateY(-50%); max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: none; z-index: 50; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px; border-radius: 9999px; display: flex; flex-direction: column; gap: 6px; align-items: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .light-theme .mobile-floating-bar { background: rgba(255, 255, 255, 0.9); border: 1px solid #000000; }

        .circle-badge-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; background: #1e293b; color: #ffffff; border: none; border-radius: 50%; cursor: pointer; transition: transform 0.2s;
        }
        .light-theme .circle-badge-btn { background: #e2e8f0; color: #000000; }
        .circle-badge-btn:hover { transform: scale(1.12); }
        .circle-badge-btn.active { background: #2563eb !important; color: #ffffff !important; }

        :root {
            --bg: #030712; --text: #f1f5f9; --text-strong: #ffffff; --muted: #94a3b8; --soft: #cbd5e1;
            --card: rgba(18, 27, 48, 0.78); --card-border: rgba(255, 255, 255, 0.10);
            --icon-color: rgba(255, 255, 255, 0.17);
        }
        body.light-theme {
            --bg: #f8fafc; --text: #1e293b; --text-strong: #0f172a; --muted: #475569; --soft: #334155;
            --card: rgba(255, 255, 255, 0.92); --card-border: rgba(15, 23, 42, 0.14);
            --icon-color: rgba(15, 23, 42, 0.15);
        }

        #thabitBg {
            position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; color: var(--icon-color);
            -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0,0,0,0.4) 0%, #000 100%);
            mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(0,0,0,0.4) 0%, #000 100%);
        }

        #wordInput.word-found { border: 3px solid #10b981 !important; box-shadow: 0 0 15px rgba(16,185,129,0.45); }
        #wordInput.word-missing { border: 3px solid #e11d48 !important; box-shadow: 0 0 15px rgba(225,29,72,0.4); }
        @keyframes reportPop {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(225,29,72,0.45); }
            50% { transform: scale(1.03); box-shadow: 0 0 0 4px rgba(225,29,72,0); }
        }
        #reportMissingBtn.pop-pulse { animation: reportPop 2.4s ease-in-out infinite; }

        .brand-logo { display: block; width: 46px; height: 46px; border-radius: 22%; box-shadow: 0 0 0 1px rgba(148,163,184,0.35); }
        .mean-btn { width: 100%; padding: 6px 4px; border-radius: 10px; font: 700 11px 'Cairo','Inter',sans-serif; line-height: 1.2; border: 1px solid rgba(148,163,184,0.4); background: rgba(2,6,23,0.6); color: #cbd5e1; cursor: pointer; transition: all .15s; }
        .mean-btn:hover { color: #ffffff; border-color: #60a5fa; }
        .mean-btn.on { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        body.light-theme .mean-btn { background: #ffffff; color: #334155; border-color: #0f172a; }
        body.light-theme .mean-btn:hover { color: #1d4ed8; }
        body.light-theme .mean-btn.on { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        #barTip { position: fixed; z-index: 200001; pointer-events: none; opacity: 0; transform: translateY(-50%) translateX(-4px); transition: opacity .18s ease, transform .18s ease; padding: 6px 12px; border-radius: 10px; background: #0f172a; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.18); font: 700 .75rem 'Cairo','Inter',sans-serif; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
        #barTip.show { opacity: 1; transform: translateY(-50%) translateX(0); }
        body.light-theme #barTip { background: #ffffff; color: #0f172a; border-color: #0f172a; }
        @media (max-width: 640px) {
            body#bodyRoot > main, body#bodyRoot > footer { padding-left: 64px !important; }
        }
    </style>
</head>

        var STEP = 60, N = 6, TILE = STEP * N, SCALE = 0.72;
        var angles = [-14, -6, 0, 7, 13, -9, 4];

        var defs = '';

        names.forEach(function (n) {
            defs += '<g id="thi-' + n + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + icons[n] + '</g>';

        var uses = '';

        for (var r = 0; r < N; r++) {
            for (var c = 0; c < N; c++) {

                updateSliderVisuals(type);

            const val = sliderValues[type];

                document.getElementById('valSpeed').innerHTML = currentSpeed === 1.4 ? '<i class="fa-solid fa-bolt text-amber-400 animate-pulse"></i>' : currentSpeed + 'x';

                let currentWait = getActiveWaitTime();
                document.getElementById('valWait').innerHTML = currentWait === 50 ? '<i class="fa-solid fa-bolt text-amber-400 animate-pulse"></i>' : currentWait + 'ms';
            } else if (type === 'comma') {
                let currentComma = getActiveCommaWait();
                document.getElementById('valComma').innerHTML = currentComma === 50 ? '<i class="fa-solid fa-bolt text-amber-400 animate-pulse"></i>' : currentComma + 'ms';
            }

            const activeCount = Math.round(val * totalSegments);
            for (let i = 0; i < totalSegments; i++) {
                const seg = document.getElementById(`seg-${type}-${i}`);
                if (!seg) continue;
                if (i < activeCount) {
                    let colorClass = i < 3 ? "bg-rose-600" : i < 6 ? "bg-orange-500" : i < 9 ? "bg-yellow-400" : i < 12 ? "bg-lime-500" : i < 15 ? "bg-emerald-500" : "bg-sky-500";

                    seg.className = "custom-slider-segment bg-slate-700 light-theme:bg-slate-300";

        let activeSliderType = null;

            e.stopPropagation();

<script>
/* side-bar hover tooltip: appears after the pointer rests on a button */
(function () {
  var HOVER_DELAY_MS = 1500;   // how long to hover before the bar shows
  var tip = document.getElementById('barTip');
  var bar = document.getElementById('mobileFloatingBar');
  if (!tip || !bar) return;
  var timer = null, hideTimer = null;
  function hide() { clearTimeout(timer); clearTimeout(hideTimer); tip.classList.remove('show'); }
  function show(btn) {
    var text = btn.dataset.tip;
    if (!text) return;
    tip.textContent = text;
    var r = btn.getBoundingClientRect();
    tip.style.left = (r.right + 10) + 'px';
    tip.style.top = (r.top + r.height / 2) + 'px';
    tip.classList.add('show');
  }
  function arm(btn, delay) {
    if (btn.hasAttribute('title')) { btn.dataset.tip = btn.getAttribute('title'); btn.removeAttribute('title'); }
    clearTimeout(timer); clearTimeout(hideTimer);
    timer = setTimeout(function () { show(btn); }, delay);
  }
  bar.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('mouseenter', function () { arm(btn, HOVER_DELAY_MS); });
    btn.addEventListener('mouseleave', hide);
    btn.addEventListener('click', hide);
    btn.addEventListener('focus', function () { arm(btn, 800); });
    btn.addEventListener('blur', hide);
    btn.addEventListener('touchstart', function () { arm(btn, 600); hideTimer = setTimeout(hide, 2600); }, { passive: true });
  });
})();
</script>

function openReportModal() {

async function submitReport() {
  const nameEl = document.getElementById('rpName');
  const probEl = document.getElementById('rpProblem');
  const err = document.getElementById('rpErr');
  const btn = document.getElementById('rpSendBtn');
  const name = nameEl.value.trim();

  if (Date.now() - lastReportAt < 20000) { err.textContent = T('rpWait'); return; }
  err.textContent = '';
  btn.disabled = true;
  const hdrs = { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };

  }).then(function (r) { return r.ok; }).catch(function () { return false; });

    method: 'POST', headers: hdrs, body: JSON.stringify({ name: name, problem: problem })
  }).then(function (r) { return r.ok; }).catch(function () { return false; });

/* ===== word status: green = all words exist, red = something missing ===== */
let wordsCache = null, wordsCacheAt = 0, statusTimer = null;
let currentAudio = null, currentResolve = null, playToken = 0;
let userRecBlob = null, userRecUrl = null;
let mainRecorder = null, mainChunks = [], mainRecording = false, mainTimerId = null, mainSeconds = 0;

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function splitWords(str) {
  return String(str || '').split(/[,،\n]+/).map(function (x) { return x.trim(); }).filter(Boolean);
}
async function getWordsList(force) {
  if (!force && wordsCache && Date.now() - wordsCacheAt < 15000) return wordsCache;
  const res = await fetch(SUPABASE_URL + '/rest/v1/words_table?select=word,audio_url', {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
  });
  const d = await res.json();
  wordsCache = Array.isArray(d) ? d : [];
  wordsCacheAt = Date.now();
  return wordsCache;
}
function findAudio(list, part) {
  const c = cleanWordString(part);
  let url = null;
  list.forEach(function (r) { if (r.word && r.audio_url && cleanWordString(r.word) === c) url = r.audio_url; });
  return url;
}
function checkMainWordStatus() {

async function runWordStatusCheck() {

  if (btn) btn.classList.remove('pop-pulse');

    const parts = splitWords(input.value);
    if (!parts.length) return;
    const allFound = parts.every(function (p) { return findAudio(list, p); });

    if (allFound) input.classList.add('word-found');
    else { input.classList.add('word-missing'); if (btn) btn.classList.add('pop-pulse'); }
  } catch (e) {}
}

/* ===== audio engine ===== */
function stopAllAudio() {
  playToken++;
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  if (currentResolve) { const r = currentResolve; currentResolve = null; r(); }
}
function playUrl(url, token, rate) {
  return new Promise(function (resolve) {
    if (token !== playToken) return resolve();
    const a = new Audio(url);
    a.preload = 'auto';
    a.playbackRate = rate || 1;
    try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch (e) {}
    currentAudio = a;
    currentResolve = resolve;
    const done = function () { if (currentResolve === resolve) currentResolve = null; resolve(); };
    a.onended = done;
    a.onerror = done;
    a.play().catch(done);
  });
}
async function playSeq(urls, token) {
  for (let i = 0; i < urls.length; i++) {
    if (token !== playToken) return;
    await playUrl(urls[i], token, getActiveSpeed());
    if (i < urls.length - 1 && token === playToken) await sleep(getActiveCommaWait());
  }
}
async function resolveWordUrls() {
  const parts = splitWords(document.getElementById('wordInput').value);
  if (!parts.length) { showGeneralToast(T('typeWord'), 'red'); return null; }
  let list;
  try { list = await getWordsList(); }
  catch (e) { showGeneralToast(T('dbFail'), 'red'); return null; }
  const urls = [], missing = [];
  parts.forEach(function (p) { const u = findAudio(list, p); if (u) urls.push(u); else missing.push(p); });
  if (!urls.length) { showGeneralToast(T('notInDb'), 'orange'); return null; }
  if (missing.length) showGeneralToast(T('noAudioFor') + missing.join('، '), 'orange');
  return urls;
}
function markBtn(btn, on) { if (btn) btn.classList.toggle('playing-active', on); }

async function runListen(times, btn) {
  stopAllAudio();
  const token = playToken;
  markBtn(btn, true);
  try {
    const urls = await resolveWordUrls();
    if (!urls || token !== playToken) return;
    for (let i = 0; i < times; i++) {
      if (token !== playToken) break;
      await playSeq(urls, token);
      if (i < times - 1 && token === playToken) await sleep(getActiveWaitTime());
    }
  } finally { markBtn(btn, false); }
}
async function runComparison(times, btn) {
  if (!userRecUrl) { showGeneralToast(T('recordFirst'), 'orange'); return; }
  stopAllAudio();
  const token = playToken;
  markBtn(btn, true);
  try {
    const urls = await resolveWordUrls();
    if (!urls || token !== playToken) return;
    for (let i = 0; i < times; i++) {
      if (token !== playToken) break;
      await playSeq(urls, token);
      if (token !== playToken) break;
      await sleep(150);
      await playUrl(userRecUrl, token, 1);
      if (i < times - 1 && token === playToken) await sleep(getActiveWaitTime());
    }
  } finally { markBtn(btn, false); }
}
function triggerRepeatAndPlayListen(n, ev) { runListen(n, ev && ev.currentTarget); }
function triggerRepeatAndPlayComp(n, ev) { runComparison(n, ev && ev.currentTarget); }
function triggerComparisonPlayback() { runComparison(1, document.getElementById('compareBtn')); }
document.getElementById('speakBtn').addEventListener('click', function () { runListen(1, null); });

/* ===== trainee recording ===== */
async function toggleMainRecording() {
  const btn = document.getElementById('recordYourVoiceBtn');
  const icon = document.getElementById('mainRecordIcon');
  const label = btn.querySelector('span');
  const timer = document.getElementById('mainRecordTimerDisplay');
  if (!mainRecording) {
    stopAllAudio();
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      mainRecorder = new MediaRecorder(st);
      mainChunks = [];
      mainRecorder.ondataavailable = function (e) { if (e.data.size > 0) mainChunks.push(e.data); };
      mainRecorder.onstop = function () {
        st.getTracks().forEach(function (t) { t.stop(); });
        userRecBlob = new Blob(mainChunks, { type: mainRecorder.mimeType || 'audio/webm' });
        if (userRecUrl) URL.revokeObjectURL(userRecUrl);
        userRecUrl = URL.createObjectURL(userRecBlob);
        showGeneralToast(T('recSaved'), 'success');
      };
      mainRecorder.start();
      mainRecording = true;
      icon.className = 'fa-solid fa-stop';
      label.textContent = T('stop');
      mainSeconds = 0;
      timer.textContent = '00:00';
      mainTimerId = setInterval(function () {
        mainSeconds++;
        timer.textContent = String(Math.floor(mainSeconds / 60)).padStart(2, '0') + ':' + String(mainSeconds % 60).padStart(2, '0');
      }, 1000);
    } catch (e) { showGeneralToast(T('micDenied'), 'red'); }
  } else {
    try { mainRecorder.stop(); } catch (e) {}
    mainRecording = false;
    clearInterval(mainTimerId);
    icon.className = 'fa-solid fa-microphone';
    label.textContent = T('yourTurn');
  }
}

/* ===== take words (download) ===== */
function encodeWav(samples, sr) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = function (o, t) { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
  }
  return new Blob([v], { type: 'audio/wav' });
}
function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function downloadCombinedAudioPackage() {
  const btn = document.getElementById('downloadAudioBtn');
  const urls = await resolveWordUrls();
  if (!urls) return;
  btn.disabled = true;
  const baseName = (splitWords(document.getElementById('wordInput').value).join('_') || 'thabit_words').replace(/[^\w؀-ۿ\-]+/g, '_').slice(0, 60);
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const buffers = [];
    for (const u of urls) {
      const ab = await (await fetch(u)).arrayBuffer();
      buffers.push(await ctx.decodeAudioData(ab));
    }
    const sr = ctx.sampleRate;
    const gap = Math.round(sr * getActiveCommaWait() / 1000);
    let total = 0;
    buffers.forEach(function (b, i) { total += b.length + (i < buffers.length - 1 ? gap : 0); });
    const out = new Float32Array(total);
    let pos = 0;
    buffers.forEach(function (b, i) {
      const chs = b.numberOfChannels;
      for (let c = 0; c < chs; c++) {
        const d = b.getChannelData(c);
        for (let k = 0; k < d.length; k++) out[pos + k] += d[k] / chs;
      }
      pos += b.length + (i < buffers.length - 1 ? gap : 0);
    });
    ctx.close();
    saveBlob(encodeWav(out, sr), baseName + '.wav');
    showGeneralToast(T('dlOk'), 'success');
  } catch (e) {
    try {
      for (let i = 0; i < urls.length; i++) {
        const b = await (await fetch(urls[i])).blob();
        saveBlob(b, baseName + '_' + (i + 1) + '.mp3');
        await sleep(400);
      }
      showGeneralToast(T('dlFiles'), 'success');
    } catch (e2) { showGeneralToast(T('dlFail'), 'red'); }
  } finally { btn.disabled = false; }
}

    return fetch(SB+"/rest/v1/site_content?select=key,value",{headers:H()}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){var m={};rows.forEach(function(r){m[r.key]=r.value});over=m;cache();apply()}).catch(function(){})
  }
  function save(k,v){
    over[k]=v;cache();apply();
    return adminFetch(SB+"/rest/v1/site_content?on_conflict=key",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})}).then(function(r){if(r.ok)return true;return r.text().then(function(t){save.err=r.status+" "+String(t||"").slice(0,140);return false})}).catch(function(e){save.err=(e&&e.message)||String(e);return false});
  }
  function reset(k){
    delete over[k];cache();apply();
    return adminFetch(SB+"/rest/v1/site_content?key=eq."+encodeURIComponent(k),{method:"DELETE"}).then(function(r){return r.ok}).catch(function(){return false});
  }
  function upload(file,folder,bucket,asAdmin){
    bucket=bucket||"placement-files";
    var name=folder+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,10)+"_"+file.name.replace(/[^\w.\-]+/g,"_");
    var o={method:"POST",headers:{"Content-Type":file.type||"application/octet-stream"},body:file},url=SB+"/storage/v1/object/"+bucket+"/"+name;
    var p=asAdmin?adminFetch(url,o):fetch(url,{method:"POST",headers:H(o.headers),body:file});
    return p.then(function(r){if(!r.ok)throw new Error("upload");return SB+"/storage/v1/object/public/"+bucket+"/"+name});
  }
  function post(table,obj){
    return fetch(SB+"/rest/v1/"+table,{method:"POST",headers:H({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify(obj)}).then(function(r){return r.ok}).catch(function(){return false});
  }
